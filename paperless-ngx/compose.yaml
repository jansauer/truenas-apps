services:
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2.0
    environment:
      PAPERLESS_REDIS: redis://valkey:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_URL: https://paperless.${DOMAIN}
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect":{"SCOPE":["openid","profile","email"],"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"pocketid","name":"Pocket ID","client_id":"${PAPERLESS_OIDC_CLIENT_ID}","secret":"${PAPERLESS_OIDC_CLIENT_SECRET}","settings":{"server_url":"${OIDC_ISSUER_URL}"}}]}}
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "false"
      PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: openai-like
      PAPERLESS_AI_LLM_MODEL: gpt-4o
      PAPERLESS_AI_LLM_API_KEY: ${OPENAI_API_KEY}
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: de-de
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: openai-like
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: text-embedding-3-small
    volumes:
      - /mnt/applications/paperless-ngx/data:/usr/src/paperless/data
      - /mnt/applications/paperless-ngx/media:/usr/src/paperless/media
      - /etc/localtime:/etc/localtime:ro
    networks:
      default:
      newt_default:
        aliases:
          - paperless
    healthcheck:
      disable: true
    restart: unless-stopped
    labels:
      - pangolin.proxy-resources.paperless.name=Paperless
      - pangolin.proxy-resources.paperless.full-domain=paperless.${DOMAIN}
      - pangolin.proxy-resources.paperless.protocol=http
      - pangolin.proxy-resources.paperless.auth.sso-enabled=true
      - pangolin.proxy-resources.paperless.targets[0].method=http
      - pangolin.proxy-resources.paperless.targets[0].hostname=paperless
      - pangolin.proxy-resources.paperless.targets[0].port=8000
      - pangolin.proxy-resources.paperless.targets[0].healthcheck.hostname=paperless
      - pangolin.proxy-resources.paperless.targets[0].healthcheck.port=8000
      - pangolin.proxy-resources.paperless.targets[0].healthcheck.path=/
      - pangolin.proxy-resources.paperless.rules[0].action=allow
      - pangolin.proxy-resources.paperless.rules[0].match=path
      - pangolin.proxy-resources.paperless.rules[0].value=/api/*
    depends_on:
      - postgres
      - valkey

  gpt:
    image: icereed/paperless-gpt:v0.28.0
    environment:
      # Paperless connection
      PAPERLESS_BASE_URL: http://webserver:8000
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      PAPERLESS_PUBLIC_URL: https://paperless.${DOMAIN}
      # Provider
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_KEY: paperless-gpt
      OPENAI_BASE_URL: http://openai-via-codex:18080/v1
      # OCR
      OCR_PROVIDER: "llm"
      VISION_LLM_PROVIDER: openai
      # VISION_LLM_MODEL: gpt-4o
      VISION_LLM_MODEL: gpt-5.6-luna
      AUTO_OCR_TAG: gpt-ocr-auto
      PDF_OCR_TAGGING: "true"
      CREATE_NEW_TAGS: "true"
      SUGGESTION_WORKERS: 3
      PDF_OCR_COMPLETE_TAG: gpt-ocr
      FAIL_TAG: gpt-failed
      OCR_LIMIT_PAGES: 20
      PDF_REPLACE: "false"
      # LLM
      LLM_PROVIDER: openai
      # LLM_MODEL: gpt-4o
      LLM_MODEL: gpt-5.6-terra
      LLM_LANGUAGE: German
      # Other
      LOG_LEVEL: info
    volumes:
      - /mnt/applications/paperless-ngx/paperless-gpt/prompts:/app/prompts
      - /mnt/applications/paperless-ngx/paperless-gpt/config:/app/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      default:
      newt_default:
        aliases:
          - paperless-gpt
    healthcheck:
      disable: true
    restart: unless-stopped
    labels:
      - pangolin.private-resources.paperless-gpt.name=Paperless GPT
      - pangolin.private-resources.paperless-gpt.mode=http
      - pangolin.private-resources.paperless-gpt.destination=paperless-gpt
      - pangolin.private-resources.paperless-gpt.destination-port=8080
      - pangolin.private-resources.paperless-gpt.full-domain=paperless-gpt.${DOMAIN}
      - pangolin.private-resources.paperless-gpt.scheme=http
      - pangolin.private-resources.paperless-gpt.ssl=true
    depends_on:
      - webserver
      - openai-via-codex

  openai-via-codex:
    image: ghcr.io/hotchpotch/openai-api-server-via-codex:latest
    environment:
      OPENAI_VIA_CODEX_API_KEY: paperless-gpt
    volumes:
      - /mnt/applications/paperless-ngx/codex:/home/app/.codex
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      disable: true
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine3.23
    shm_size: 256mb
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    volumes:
      - /mnt/applications/paperless-ngx/postgres:/var/lib/postgresql/18/docker
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.2-alpine
    volumes:
      - /mnt/applications/paperless-ngx/valkey:/data
    restart: unless-stopped

networks:
  newt_default:
    external: true
