services:
  plex:
    image: linuxserver/plex:1.43.5@sha256:31e4c2de666cd130bc389133b6c63af08912559d992370e52822f8f229185aef
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
    volumes:
      - /mnt/applications/plex:/config
      - /mnt/space/media:/media:rw
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri
    network_mode: host
    restart: unless-stopped
