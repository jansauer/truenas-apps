# The Fujitsu backend defaults to US Letter dimensions. Setting the A4
# media size also makes its automatic feeder centering use the sheet width.
device .*ScanSnap iX500.*
page-width 210
page-height 297
# The iX500 can expose a thin feeder/background edge even with the correct
# media dimensions. Let sane-fujitsu detect the sheet edges and remove it.
swcrop yes
