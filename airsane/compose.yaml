services:
  airsane:
    image: airsane-local:local
    pull_policy: build
    build:
      context: .
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /run/dbus:/run/dbus
      - /etc/localtime:/etc/localtime:ro
    device_cgroup_rules:
      - "c 189:* rmw"
    network_mode: host
    restart: unless-stopped
