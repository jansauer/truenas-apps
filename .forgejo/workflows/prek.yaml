name: Prek

on:
  pull_request:
    branches:
      - main

jobs:
  prek:
    runs-on: docker
    container:
      image: cimg/node:26.13.1
      options: --user root
    steps:
      - name: Check out the pull request
        uses: https://data.forgejo.org/actions/checkout@v7.0.1

      - name: Run prek
        uses: https://github.com/j178/prek-action@v3.1.1
        with:
          prek-version: latest-known
