services:
  app:
    image: codeberg.org/forgejo/forgejo:17.0.2@sha256:879f4f10a98e3e167b32cde5f7ae3af0163d50bfacf567559a27a0e95a95670c
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - /mnt/applications/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      default:
      newt_default:
        aliases:
          - forgejo
    restart: unless-stopped
    labels:
      - pangolin.proxy-resources.forgejo.name=Forgejo
      - pangolin.proxy-resources.forgejo.full-domain=forgejo.${DOMAIN}
      - pangolin.proxy-resources.forgejo.protocol=http
      - pangolin.proxy-resources.forgejo.auth.sso-enabled=false
      - pangolin.proxy-resources.forgejo.targets[0].method=http
      - pangolin.proxy-resources.forgejo.targets[0].hostname=forgejo
      - pangolin.proxy-resources.forgejo.targets[0].port=3000
      - pangolin.proxy-resources.forgejo.targets[0].healthcheck.hostname=forgejo
      - pangolin.proxy-resources.forgejo.targets[0].healthcheck.port=3000
      - pangolin.proxy-resources.forgejo.targets[0].healthcheck.path=/api/healthz

  runner:
    image: data.forgejo.org/forgejo/runner:13.2.2@sha256:a8543a45fe62bebef0534d5c223cf485d3294e6dd2e42a82dbcbfd40c54a6a22
    user: 1001:1001
    group_add:
      - "999"   # host docker group GID
    # command: '/bin/sh -c "while : ; do sleep 1 ; done ;"'
    command: 'forgejo-runner daemon --config runner-config.yml'
    volumes:
      - /mnt/applications/forgejo/runner:/data
      - /mnt/applications/forgejo/runner-cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

networks:
  newt_default:
    external: true
